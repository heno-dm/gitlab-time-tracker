name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y gettext gnome-shell libglib2.0-bin

    - name: Build extension
      run: make build

    - name: Rename artifact with version
      run: mv build/timelogs-extension@heno-dm.github.io.shell-extension.zip "build/timelogs-extension@heno-dm.github.io-${GITHUB_REF_NAME}.shell-extension.zip"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/timelogs-extension@heno-dm.github.io-${{ github.ref_name }}.shell-extension.zip
