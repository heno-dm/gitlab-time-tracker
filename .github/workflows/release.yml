name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y gettext gnome-shell libglib2.0-bin git unzip

    - name: Build extension
      run: make build

    - name: Run Shexli
      run: |
        python3 -m venv /tmp/shexli-venv
        /tmp/shexli-venv/bin/pip install 'shexli==0.2.1' 'tree-sitter==0.26.0' 'tree-sitter-javascript==0.25.0'
        mkdir /tmp/timelogs-extension
        unzip -q build/timelogs-extension@heno-dm.github.io.shell-extension.zip -d /tmp/timelogs-extension
        set +e
        /tmp/shexli-venv/bin/shexli /tmp/timelogs-extension
        status=$?
        set -e
        if [ "$status" -eq 139 ]; then
          echo "::warning::Shexli 0.2.1 crashed with SIGSEGV on the GitHub runner; continuing because no analysis result was produced."
        elif [ "$status" -ne 0 ]; then
          exit "$status"
        fi

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

    - name: Rename artifact with version
      run: |
        VERSION=${{ env.VERSION }}
        mv build/timelogs-extension@heno-dm.github.io.shell-extension.zip "build/timelogs-extension@heno-dm.github.io-v${VERSION}.shell-extension.zip"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/timelogs-extension@heno-dm.github.io-v${{ env.VERSION }}.shell-extension.zip
